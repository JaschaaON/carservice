# Baut das Container-Image und legt es in die GitHub Container Registry.
# Dadurch sieht Dockhand echte Updates und kann sie per Klick einspielen.

name: Image bauen

on:
  push:
    branches: [main]
    # Reine Doku- oder Konverteraenderungen landen nicht im Image.
    paths-ignore:
      - 'README.md'
      - '*.py'
      - 'Inspektionstabelle.xlsx'
      - 'docker-compose.yml'
  workflow_dispatch:        # erlaubt manuelles Ausloesen

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Namespace muss kleingeschrieben sein.
          tags: |
            ghcr.io/jaschaaon/carservice:latest
            ghcr.io/jaschaaon/carservice:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
