<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090a">
<!-- Vollstaendig wie in index.html: Wer nicht angemeldet ist, landet auf
     dieser Seite — und installiert die App genau von hier aus. Fehlten die
     Angaben, hiesse das Symbol auf dem Startbildschirm "Anmelden · …" und
     waere ein Bildschirmfoto. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carservice">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" href="icon-192.png">
<title>Anmelden · Overlandvibe Carservice</title>
<style>
@font-face{font-family:'Geist';font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/geist-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:'Geist';font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/geist-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Geist Mono';font-style:normal;font-weight:400 500;font-display:swap;src:url(fonts/geist-mono-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:'Geist Mono';font-style:normal;font-weight:400 500;font-display:swap;src:url(fonts/geist-mono-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}

:root{
  --bg:#08090a; --surface:#16181b; --surface-2:#1e2125; --line:#23262a;
  --line-hell:#2f3338;
  --text:#f0f1f3; --text-dim:#9ea4aa; --text-faint:#686d73;
  --accent:#c8ced4; --ok:#5ec98c; --warn:#e8b24a; --crit:#ff6b60; --info:#a78bfa;
  --mat-flaeche: linear-gradient(180deg,#16181b,#0f1113);
  --mat-erhaben: linear-gradient(160deg,#1d1f23 0%,#141619 45%,#0f1113 100%);
  --mat-vertieft:linear-gradient(180deg,#0b0c0e,#141619);
  --mat-silber:  linear-gradient(180deg,#eceef0,#b9bfc5);
  --mat-knopf:   linear-gradient(180deg,#1e2125,#141619);
  --kante:       inset 0 1px 0 rgba(255,255,255,.07);
  --kante-stark: inset 0 1px 0 rgba(255,255,255,.13), inset 0 -1px 0 rgba(0,0,0,.6);
  --schrift: Geist, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --schrift-zahl: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--text);
  font:15px/1.5 var(--schrift);
  padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.karte{width:100%;max-width:370px}
.marke{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:26px}
.marke svg{width:34px;height:34px}
.marke b{font-size:17px;font-weight:650;letter-spacing:-.01em}
.marke span{color:var(--text-faint);font-size:17px}

form{background:var(--mat-erhaben);border:1px solid #2c3035;border-radius:16px;padding:24px;box-shadow:var(--kante-stark), 0 20px 50px rgba(0,0,0,.55)}
h1{margin:0 0 4px;font-size:18px;font-weight:650;letter-spacing:-.01em}
.unter{color:var(--text-dim);font-size:13.5px;margin:0 0 20px}
label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;font-weight:500}
input{
  width:100%;padding:11px 12px;background:var(--mat-vertieft);
  border:1px solid var(--line);border-radius:9px;color:var(--text);font:inherit;
  margin-bottom:14px;box-shadow:inset 0 1px 2px rgba(0,0,0,.4);
}
input:focus{outline:none;border-color:var(--accent)}
button{
  width:100%;padding:12px;background:var(--mat-silber);border:none;border-radius:9px;
  color:#15171a;font:inherit;font-weight:600;cursor:pointer;margin-top:4px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 1px 3px rgba(0,0,0,.5);
}
button:hover:not(:disabled){background:linear-gradient(180deg,#f6f7f8,#c6ccd2)}
button:disabled{opacity:.6;cursor:default}
.fehler{
  background:rgba(255,95,86,.1);border:1px solid rgba(255,95,86,.3);
  border-radius:9px;padding:10px 12px;font-size:13.5px;color:var(--crit);
  margin-bottom:16px;display:none;
}
.fehler.an{display:block}
.fuss{text-align:center;color:var(--text-faint);font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="karte">
  <div class="marke">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="32" fill="#111413"/>
      <path d="M10 43 L21.5 25 L29 35 L37 22.5 L54 43 Z" fill="#F2EFE9"/>
      <path d="M10 51 C17.5 47, 24 54, 32 50.5 C40 47, 46.5 54, 54 50"
            fill="none" stroke="#E0872A" stroke-width="4.2" stroke-linecap="round"/>
    </svg>
    <div><b>overlandvibe</b> <span>carservice</span></div>
  </div>

  <form id="formular" autocomplete="on">
    <h1>Anmelden</h1>
    <p class="unter">Fahrzeugwartung, Teile und Anleitungen.</p>
    <div class="fehler" id="fehler" role="alert"></div>

    <label for="login">Anmeldename</label>
    <input id="login" name="username" autocomplete="username" autocapitalize="none"
           autocorrect="off" spellcheck="false" required>

    <label for="passwort">Passwort</label>
    <input id="passwort" name="password" type="password" autocomplete="current-password" required>

    <button type="submit" id="knopf">Anmelden</button>
  </form>

  <p class="fuss">Kein Zugang? Der Administrator legt Konten an.</p>
</div>

<script>
"use strict";
const formular = document.getElementById("formular");
const fehler   = document.getElementById("fehler");
const knopf    = document.getElementById("knopf");

function zeigeFehler(text){
  fehler.textContent = text;
  fehler.classList.add("an");
}

formular.addEventListener("submit", async e=>{
  e.preventDefault();
  fehler.classList.remove("an");
  knopf.disabled = true;
  knopf.textContent = "Moment …";
  try{
    const antwort = await fetch("api/login", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        login:    document.getElementById("login").value,
        passwort: document.getElementById("passwort").value
      })
    });
    const daten = await antwort.json().catch(()=>({}));
    if(!antwort.ok){
      zeigeFehler(daten.error || "Anmeldung fehlgeschlagen");
      document.getElementById("passwort").value = "";
      return;
    }
    // Ziel aus ?weiter= übernehmen, aber nur eigene Pfade zulassen
    const weiter = new URL(location.href).searchParams.get("weiter");
    location.href = (weiter && weiter.startsWith("/") && !weiter.startsWith("//")) ? weiter : "/";
  }catch(err){
    zeigeFehler("Server nicht erreichbar");
  }finally{
    knopf.disabled = false;
    knopf.textContent = "Anmelden";
  }
});

document.getElementById("login").focus();
</script>
</body>
</html>
